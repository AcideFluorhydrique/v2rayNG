# fdroidserver configuration for this fork's own F-Droid repository, published
# to GitHub Pages by .github/workflows/release.yml. Secrets are not stored here:
# each {env: ...} value is read from the environment release.yml sets up from
# the repository's GitHub secrets. See docs/maintenance.md.

repo_url: https://acidefluorhydrique.github.io/v2rayNG/repo
repo_name: Forkray
repo_description: >-
  Forkray, a fork of v2rayNG, compiled from source on GitHub Actions.
  Every release publishes a build manifest with the exact sources,
  toolchain and checksums, so it can be rebuilt and compared.
  Source: https://github.com/AcideFluorhydrique/v2rayNG

# Only the APKs release.yml puts in repo/ are offered; there is no archive.
archive_older: 0

# Copies of the repository on other hosts, published by release.yml right
# after GitHub Pages. They are listed in the signed index, so clients that
# already have the repository learn of them and switch over by themselves
# when GitHub is unreachable or the repository there is gone. fdroidserver
# appends "/repo" to each address. A mirror needs no trust: clients accept an
# index only if it is signed by this repository's key.
#
# countryCode is where the host's servers are, and clients show it as a flag.
# Leave it out for a host behind an anycast CDN, which answers from wherever
# the client is: GitHub Pages (Fastly) and gitlab.com (Cloudflare).
mirrors:
  - url: https://lanticy.codeberg.page/forkray-fdroid/fdroid
    countryCode: DE
  # The same Codeberg site under its own domain, bound to the repository
  # through Codeberg's Pages webhook; every push to it redeploys this too.
  - url: https://ray.arielx.is-a.dev/fdroid
    countryCode: DE
  - url: https://hydrofluoricacid.gitlab.io/forkray-fdroid/fdroid
    countryCode: US
  # The same branch read straight from the GitLab repository, for when GitLab
  # Pages is down but gitlab.com is not. Nothing extra is published for it.
  - url: https://gitlab.com/HydrofluoricAcid/forkray-fdroid/-/raw/pages/fdroid
  # 0xacab, Riseup's GitLab, serves its Pages under itcouldbewor.se.
  - url: https://lanticy.itcouldbewor.se/forkray-fdroid/fdroid
    countryCode: US
  - url: https://0xacab.org/lanticy/forkray-fdroid/-/raw/pages/fdroid
    countryCode: US
  # A GitHub repository of its own, AcideFluorhydrique/forkray-fdroid, so that
  # its custom domain does not redirect the main address. GitHub Pages is
  # behind Fastly, hence no countryCode.
  - url: https://forkray.is-my.app/fdroid

sdk_path: $ANDROID_HOME

keystore: keystore.jks
repo_keyalias: {env: FDROID_REPO_KEY_ALIAS}
keystorepass: {env: FDROID_REPO_KEYSTORE_PASSWORD}
keypass: {env: FDROID_REPO_KEY_PASSWORD}
